<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>City Info</title>

<style>
body { font-family: Arial; background:#f4f6ff; padding:20px; text-align:center; }
.card { background:white; padding:20px; border-radius:10px; max-width:600px; margin:auto; }
img { width:100%; border-radius:10px; }
button { padding:10px; margin:5px; }
</style>
</head>

<body>

<button onclick="setLang('en')">EN 🇬🇧</button>
<button onclick="setLang('sq')">SQ 🇦🇱</button>

<div class="card">
<h1 id="title"></h1>
<img id="img">
<p id="desc"></p>
<p id="food"></p>
<p id="fact"></p>
<p id="visit"></p>
</div>

<script>

let city = localStorage.getItem("city");
let lang = "en";

const data = {
tirana:{
name:"Tirana",
en:"Capital of Albania with modern life and culture.",
sq:"Kryeqyteti i Shqipërisë me jetë moderne dhe kulturë.",
food:"🥟 Byrek, 🍲 Tavë Kosi",
fact:"Became capital in 1920",
visit:"Skanderbeg Square, Dajti Mountain",
img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Tirana_skyline.jpg"
},

durres:{
name:"Durrës",
en:"Coastal city with ancient Roman history.",
sq:"Qytet bregdetar me histori romake.",
food:"🐟 Seafood, 🍞 Traditional bread",
fact:"One of the oldest cities in Albania",
visit:"Roman Amphitheatre, Beach",
img:"https://upload.wikimedia.org/wikipedia/commons/6/6e/Durr%C3%ABs_view.jpg"
}
};

function setLang(l){
lang = l;
loadCity();
}

function loadCity(){

let c = data[city];

document.getElementById("title").innerText = c.name;

document.getElementById("img").src = c.img;

document.getElementById("desc").innerText =
(lang==="en") ? c.en : c.sq;

document.getElementById("food").innerText = c.food;
document.getElementById("fact").innerText = c.fact;
document.getElementById("visit").innerText = c.visit;
}

loadCity();

</script>

</body>
</html>
