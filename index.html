<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Climaplan Albania</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { font-family: Arial; margin:0; background:#eef6ff; }
header { background:#2d6cdf; color:white; padding:20px; text-align:center; }

.container { padding:20px; text-align:center; }

input { padding:10px; width:250px; }
button { padding:10px; cursor:pointer; margin:5px; }

#map { height:500px; width:95%; margin:20px auto; border-radius:10px; }

.card {
margin-top:15px;
background:white;
padding:15px;
border-radius:10px;
display:inline-block;
}
</style>
</head>

<body>

<header>
<h1>Climaplan Albania 🇦🇱</h1>
</header>

<div class="container">

<input id="cityInput" placeholder="Enter Albanian city">
<button onclick="searchCity()">Search</button>

<p id="msg"></p>

<div id="map"></div>

<div id="weatherCard" class="card" style="display:none;">
<h3 id="cityName"></h3>
<p id="temp"></p>
<p id="wind"></p>
<p id="humidity"></p>
<p id="desc"></p>
<button onclick="goMore()">More about city</button>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const API_KEY = "5085341330d4a13b0831284275c39384";

const cities = {
"tirana":[41.3275,19.8189],
"durres":[41.3246,19.4569],
"vlore":[40.4661,19.4914],
"shkoder":[42.0685,19.5188],
"berat":[40.7058,19.9522],
"elbasan":[41.1102,20.0823],
"gjirokaster":[40.0758,20.1389]
};

let currentCity = "";

let map = L.map('map').setView([41.3275,19.8189],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:18
}).addTo(map);

function searchCity(){

let city = document.getElementById("cityInput").value.toLowerCase().trim();

if(!cities[city]){
document.getElementById("msg").innerText =
"This place is not in Albania 🇦🇱";
return;
}

currentCity = city;

let coords = cities[city];

map.setView(coords,11);
L.marker(coords).addTo(map);

// IMPORTANT FIX: use city + country code
fetch(https://api.openweathermap.org/data/2.5/weather?q=${city},AL&appid=${API_KEY}&units=metric)
.then(res => res.json())
.then(data => {

if(!data || !data.main){
document.getElementById("msg").innerText =
"Weather data not found ❌";
return;
}

document.getElementById("weatherCard").style.display="block";

document.getElementById("cityName").innerText = city.toUpperCase();

document.getElementById("temp").innerText =
"Temperature: " + data.main.temp + "°C";

document.getElementById("wind").innerText =
"Wind: " + data.wind.speed + " m/s";

document.getElementById("humidity").innerText =
"Humidity: " + data.main.humidity + "%";

document.getElementById("desc").innerText =
data.weather[0].description;

})
.catch(err => {
document.getElementById("msg").innerText =
"Error loading weather ❌";
console.log(err);
});

}
function goMore(){
localStorage.setItem("city", currentCity);
window.location.href="city.html";
}

</script>

</body>
</html>
