<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Climaplan Albania</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { font-family: Arial; margin:0; background:#eef6ff; }
header { background:#2d6cdf; color:white; padding:20px; text-align:center; }

.container { padding:20px; text-align:center; }

input, button { padding:10px; margin:5px; }

#map { height:500px; width:95%; margin:20px auto; border-radius:10px; }

.card {
background:white;
padding:15px;
margin-top:15px;
display:inline-block;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1 id="title">Climaplan Albania 🇦🇱</h1>

<button onclick="setLang('en')">EN 🇬🇧</button>
<button onclick="setLang('sq')">SQ 🇦🇱</button>
</header>

<div class="container">

<input id="cityInput" placeholder="Enter Albanian city">
<button onclick="searchCity()" id="searchBtn">Search</button>

<p id="msg"></p>

<div id="map"></div>

<div class="card" id="weatherCard" style="display:none;">
<h2 id="cityName"></h2>
<p id="temp"></p>
<p id="wind"></p>
<p id="humidity"></p>
<p id="desc"></p>

<button onclick="goCity()">More about city</button>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const API_KEY = "9de43a81fe7ad37cf116c9b9defe5826";

let lang = "en";
let currentCity = "";

const cities = {
"tirana":[41.3275,19.8189],
"durres":[41.3246,19.4569],
"vlore":[40.4661,19.4914],
"shkoder":[42.0685,19.5188],
"berat":[40.7058,19.9522],
"elbasan":[41.1102,20.0823],
"gjirokaster":[40.0758,20.1389]
};

let map = L.map('map').setView([41.3275,19.8189],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:18
}).addTo(map);

function setLang(l){
lang = l;

document.getElementById("title").innerText =
l==="en" ? "Climaplan Albania 🇦🇱" : "Climaplan Shqipëri 🇦🇱";

document.getElementById("searchBtn").innerText =
l==="en" ? "Search" : "Kërko";
}

function searchCity(){

let city = document.getElementById("cityInput").value.toLowerCase().trim();

if(!cities[city]){
document.getElementById("msg").innerText =
lang==="en"
?"This place is not in Albania 🇦🇱"
:"Ky vend nuk është në Shqipëri 🇦🇱";
return;
}

currentCity = city;

let coords = cities[city];

map.setView(coords,11);
L.marker(coords).addTo(map);

fetch(https://api.openweathermap.org/data/2.5/weather?q=${city},AL&appid=${API_KEY}&units=metric)
.then(res=>res.json())
.then(data=>{

if(!data.main){
document.getElementById("msg").innerText =
"Weather not found";
return;
}

document.getElementById("weatherCard").style.display="block";

document.getElementById("cityName").innerText = city.toUpperCase();

document.getElementById("temp").innerText =
(lang==="en"?"Temperature: ":"Temperatura: ") + data.main.temp + "°C";

document.getElementById("wind").innerText =
(lang==="en"?"Wind: ":"Era: ") + data.wind.speed + " m/s";

document.getElementById("humidity").innerText =
(lang==="en"?"Humidity: ":"Lagështia: ") + data.main.humidity + "%";

document.getElementById("desc").innerText =
data.weather[0].description;

});

}

function goCity(){
localStorage.setItem("city", currentCity);
window.location.href="city.html";
}

</script>

</body>
</html>
