<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Climaplan Albania</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { font-family: Arial; text-align:center; margin:0; background:#eef6ff; }
header { background:#2d6cdf; color:white; padding:15px; }
input, button { padding:10px; margin:5px; }

#map {
height:450px;
width:95%;
margin:auto;
border-radius:10px;
}

#infoBox {
display:none;
background:white;
padding:15px;
margin:15px auto;
width:90%;
max-width:500px;
border-radius:10px;
text-align:left;
}
</style>
</head>

<body>

<header>
<h2>Climaplan Albania 🇦🇱</h2>
</header>

<br>

<input id="cityInput" placeholder="Enter Albanian county">
<button onclick="searchCity()">Search</button>

<p id="msg"></p>

<div id="map"></div>

<!-- 🏙️ CITY INFO BOX -->
<div id="infoBox">
<h2 id="cityTitle"></h2>
<p id="cityDesc"></p>
<p id="cityFood"></p>
<p id="cityFact"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 🗺️ MAP (YOUR ORIGINAL WORKING VERSION)
let map = L.map('map').setView([41.3275,19.8189],8);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OpenStreetMap'
}).addTo(map);

let marker;

// 🟢 ALBANIA COUNTIES
const counties = {
"tirana":[41.3275,19.8189],
"durres":[41.3246,19.4569],
"diber":[41.5889,20.2356],
"shkoder":[42.0685,19.5188],
"elbasan":[41.1102,20.0823],
"fier":[40.7239,19.5561],
"korce":[40.6167,20.7833],
"gjirokaster":[40.0758,20.1389],
"kukes":[42.0769,20.4219],
"lezhe":[41.7861,19.6547],
"berat":[40.7058,19.9522],
"vlore":[40.4661,19.4914]
};

// 📖 CITY INFO DATA
const cityInfo = {
tirana: {
desc: "The heart of Albania, Tirana County is home to the country’s capital and is known for its vibrant city life, museums, and nightlife.",
food: "🍲 Traditional food: Tavë Kosi (baked lamb with yogurt).",
fact: "🎯 Fun fact: Tirana became Albania’s capital in 1920 after the Congress of Lushnjë."
},

durres: {
desc: "A coastal county famous for sandy beaches, tourism, and Albania’s largest seaport.",
food: "🍲 Traditional food: Fresh seafood, especially grilled fish.",
fact: "🎯 Historical fact: Durrës is one of the oldest cities in Albania, founded around the 7th century BC."
},

diber: {
desc: "Known for its mountains, forests, and beautiful natural scenery.",
food: "🍲 Traditional food: Jufka Dibre (traditional handmade pasta).",
fact: "🎯 Fun fact: Dibër is home to the highest peak in Albania, Mount Korab."
},

shkoder: {
desc: "A region rich in history, culture, and stunning landscapes.",
food: "🍲 Traditional food: Krap në Tavë (baked carp).",
fact: "🎯 Historical fact: Shkodër is one of the oldest cities in the Balkans."
},

elbasan: {
desc: "Famous for its castle and cultural heritage.",
food: "🍲 Traditional food: Ballokume cookie.",
fact: "🎯 Fun fact: Ballokume is made for Summer Day celebrations."
},

fier: {
desc: "Known for agriculture and ancient archaeological sites.",
food: "🍲 Traditional food: Byrek with cheese.",
fact: "🎯 Historical fact: Apollonia was an important Roman city near Fier."
},

korce: {
desc: "Famous for culture and cold winters.",
food: "🍲 Traditional food: Lakror pie.",
fact: "🎯 Fun fact: First Albanian school opened here in 1887."
},

gjirokaster: {
desc: "Stone city and UNESCO heritage site.",
food: "🍲 Traditional food: Qifqi rice balls.",
fact: "🎯 Historical fact: UNESCO World Heritage city."
},

kukes: {
desc: "Mountain region with lakes and scenery.",
food: "🍲 Traditional food: Flija.",
fact: "🎯 Fun fact: Sheltered refugees during Kosovo War."
},

lezhe: {
desc: "Coastal historical region.",
food: "🍲 Traditional food: Meat casserole.",
fact: "🎯 Historical fact: Skanderbeg’s memorial is here."
},

berat: {
desc: "City of a Thousand Windows.",
food: "🍲 Traditional food: Pula me Përshesh.",
fact: "🎯 UNESCO World Heritage Site."
},

vlore: {
desc: "Where Albania declared independence in 1912.",
food: "🍲 Traditional food: Seafood and octopus.",
fact: "🎯 Historical fact: Independence declared here in 1912."
}
};

// 🔎 SEARCH FUNCTION
function searchCity(){

let input = document.getElementById("cityInput").value
.toLowerCase()
.trim();

let found = Object.keys(counties).find(c =>
input.includes(c)
);

if(!found){
document.getElementById("msg").innerText =
"This place is not in Albania 🇦🇱";
document.getElementById("infoBox").style.display = "none";
return;
}

let coords = counties[found];

// 🧹 remove old marker
if(marker) map.removeLayer(marker);

// 📍 new marker
marker = L.marker(coords).addTo(map)
.bindPopup(found.toUpperCase())
.openPopup();

// 🎯 move map
map.setView(coords,10);

// clear error
document.getElementById("msg").innerText = "";

// 📖 SHOW INFO
let info = cityInfo[found];

document.getElementById("infoBox").style.display = "block";

document.getElementById("cityTitle").innerText = found.toUpperCase();
document.getElementById("cityDesc").innerText = info.desc;
document.getElementById("cityFood").innerText = info.food;
document.getElementById("cityFact").innerText = info.fact;

}

</script>

</body>
</html>
