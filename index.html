<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Visitor Albania</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #f4f7ff;
text-align: center;
}

/* HEADER */
header {
background: linear-gradient(90deg, #2d6cdf, #4a90e2);
color: white;
padding: 25px;
}

h1 {
font-size: 42px;
margin: 0;
letter-spacing: 2px;
}

/* INPUT */
input, button {
padding: 10px;
margin: 8px;
border-radius: 8px;
border: none;
}

button {
background: #2d6cdf;
color: white;
cursor: pointer;
}

/* MAP */
#map {
height: 450px;
width: 95%;
margin: auto;
border-radius: 12px;
}

/* ERROR */
#msg {
color: red;
font-weight: bold;
margin-top: 10px;
}

/* CARD DESIGN */
.card-container {
display: flex;
justify-content: center;
flex-wrap: wrap;
margin-top: 15px;
}

.card {
background: white;
width: 90%;
max-width: 600px;
margin: 15px;
padding: 20px;
border-radius: 15px;
box-shadow: 0 5px 15px rgba(0,0,0,0.1);
text-align: left;
}

.card h2 {
margin-top: 0;
color: #2d6cdf;
}

.section-title {
font-weight: bold;
margin-top: 10px;
color: #333;
}
</style>
</head>

<body>

<header>
<h1>Visitor Albania 🇦🇱</h1>
</header>

<br>

<input id="cityInput" placeholder="Enter Albanian county">
<button onclick="searchCity()">Search</button>

<p id="msg"></p>

<div id="map"></div>

<!-- MODERN CARD -->
<div class="card-container">
<div class="card" id="infoCard" style="display:none;">
<h2 id="cityTitle"></h2>
<p id="cityDesc"></p>
<p class="section-title">🍲 Food</p>
<p id="cityFood"></p>
<p class="section-title">🎯 Fun Fact</p>
<p id="cityFact"></p>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* 🗺️ MAP */
let map = L.map('map').setView([41.3275,19.8189],8);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OpenStreetMap'
}).addTo(map);

let marker;

/* 🟢 COUNTIES */
const counties = {
"tirana":[41.3275,19.8189],
"durres":[41.3246,19.4569],
"diber":[41.5889,20.2356],
"shkoder":[42.0685,19.5188],
"elbasan":[41.1102,20.0823],
"fier":[40.7239,19.5561],
"korce":[40.6167,20.7833],
"gjirokaster":[40.0758,20.1389],
"kukes":[42.0769,20.4219],
"lezhe":[41.7861,19.6547],
"berat":[40.7058,19.9522],
"vlore":[40.4661,19.4914]
};

/* 📖 CITY DATA */
const cityInfo = {

",
food: "The most famous dish is Tavë Kosi, made with baked lamb and yogurt. You can also try fërgesë, byrek, qofte, and many grilled meats in traditional restaurants.",
place: "Blloku district is great for modern food spots, while the old city center has traditional Albanian restaurants.",
time: "Spring (April–June) and autumn (September–October) are ideal because the weather is warm but not too hot, and the city is perfect for walking and exploring.
",
fact: "Tirana was once filled with grey Soviet-style buildings, but after 1990, the city transformed with colorful painted apartments to symbolize hope and change."
},

food: "Seafood is the highlight—grilled fish, calamari, octopus, and fresh mussels are served daily. Olive oil and fresh vegetables are also key parts of the cuisine.

},

place: "Guesthouses in mountain villages are the best place to try traditional cooking made by local families.",
time: "Late spring (May–June) and early autumn (September) are best because the mountains are green and weather is comfortable for hiking.",

},

shkoder: {
desc: "Shkodër County is one of Albania’s most cultural and historical regions. It is located near Lake Shkodër, the largest lake in the Balkans, and is surrounded by rivers and mountains. The city is known for its strong artistic traditions, photography culture, and music history.",

},

place: "Inside Elbasan Castle, you can find traditional bakeries and restaurants serving local dishes.",

desc: "Fier County is known for its fertile plains, agriculture, and important ancient ruins. It is one of Albania’s main food-producing regions and also has major archaeological importance..",

place: "Rural farms and traditional restaurants near Fier city offer authentic home-cooked Albanian food.",

food: "Flija (layered pancake dish), corn bread, dairy products, and roasted meat are common..",
place: "Mountain guesthouses and family homes are the best places to try traditional cooking.",

fact: "Kukës gained international attention in 1999 when it hosted thousands of refugees during the Kosovo War."
},

lezhe: {
desc: "Lezhë County is a peaceful coastal region with a mix of beaches, rivers, and historical sites. It is less crowded than other tourist destinations, making it ideal for calm travel.",

place: "Lungomare in Vlorë and seaside villages like Dhërmi, Himarë, and Jale offer amazing food spots.",

/* 🔎 SEARCH */
function searchCity(){

let input = document.getElementById("cityInput").value.toLowerCase().trim();

let found = Object.keys(counties).find(c => input.includes(c));

if(!found){
document.getElementById("msg").innerText =
"This place is not an Albania’s county 🇦🇱";
document.getElementById("infoCard").style.display = "none";
return;
}

let coords = counties[found];

/* MAP */
if(marker) map.removeLayer(marker);

marker = L.marker(coords).addTo(map)
.bindPopup(found.toUpperCase())
.openPopup();

map.setView(coords,10);

/* INFO CARD */
let info = cityInfo[found];

document.getElementById("infoCard").style.display = "block";

document.getElementById("cityTitle").innerText = found.toUpperCase();
document.getElementById("cityDesc").innerText = info.desc;
document.getElementById("cityFood").innerText = info.food;
document.getElementById("cityFact").innerText = info.fact;

/* CLEAR ERROR */
document.getElementById("msg").innerText = "";

}

</script>

</body>
</html>
