<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Visitor Albania</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
margin: 0;
font-family: Arial;
background: #eef3ff;
text-align: center;
}

header {
background: linear-gradient(90deg,#2d6cdf,#4a90e2);
color: white;
padding: 25px;
}

h1 { font-size: 42px; margin: 0; }

input, button {
padding: 10px;
margin: 8px;
border-radius: 8px;
border: none;
}

button {
background: #2d6cdf;
color: white;
cursor: pointer;
}

#map {
height: 450px;
width: 95%;
margin: auto;
border-radius: 12px;
}

#msg {
color: red;
font-weight: bold;
}

.card {
background: white;
width: 92%;
max-width: 1000px;
margin: 20px auto;
padding: 25px;
border-radius: 15px;
box-shadow: 0 10px 25px rgba(0,0,0,0.15);
text-align: left;
display: none;
white-space: pre-line;
}

.card h2 {
color: #2d6cdf;
}
</style>
</head>

<body>

<header>
<h1>Visitor Albania 🇦🇱</h1>
</header>

<input id="cityInput" placeholder="Enter Albanian county">
<button onclick="searchCity()">Search</button>

<p id="msg"></p>

<div id="map"></div>

<div class="card" id="infoCard">
<h2 id="title"></h2>
<div id="text"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */
let map = L.map('map').setView([41.3275,19.8189],8);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OpenStreetMap'
}).addTo(map);

let marker;

/* FIX INPUT */
function normalize(t){
return t.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

/* COUNTIES */
const counties = {
tirana:[41.3275,19.8189],
tirane:[41.3275,19.8189],
tiran:[41.3275,19.8189],
durres:[41.3246,19.4569],
durrës:[41.3246,19.4569],
diber:[41.5889,20.2356],
shkoder:[42.0685,19.5188],
elbasan:[41.1102,20.0823],
fier:[40.7239,19.5561],
korce:[40.6167,20.7833],
korca:[40.6167,20.7833],
korçë:[40.6167,20.7833],
gjirokaster:[40.0758,20.1389],
kukes:[42.0769,20.4219],
lezhe:[41.7861,19.6547],
berat:[40.7058,19.9522],
vlore:[40.4661,19.4914]
};

/* FULL TEXTS (YOUR EXACT CONTENT RESTORED) */
const cityInfo = {

tirana:`Tirana County

Tirana County is the most dynamic and modern part of Albania. The capital city is full of life, with colorful buildings, busy cafés, universities, museums, and a growing nightlife scene. You’ll also find cultural landmarks like Skanderbeg Square, the National History Museum, and the Pyramid of Tirana. The city mixes history with modern energy, and it’s always changing and expanding.

Traditional food to try: The most famous dish is Tavë Kosi, made with baked lamb and yogurt. You can also try fërgesë, byrek, qofte, and many grilled meats in traditional restaurants.

Food place idea: Blloku district is great for modern food spots, while the old city center has traditional Albanian restaurants.

Best time to visit: Spring (April–June) and autumn (September–October) are ideal because the weather is warm but not too hot, and the city is perfect for walking and exploring.

Fun fact: Tirana was once filled with grey Soviet-style buildings, but after 1990, the city transformed with colorful painted apartments to symbolize hope and change.`,

durres:`Durrës County

Durrës County is one of the oldest and most important coastal regions in Albania. The city has over 2,500 years of history and was once a major Roman port. Today, it is famous for its beaches, summer tourism, and seaside atmosphere. The long Adriatic coastline makes it a popular escape from Tirana.

Traditional food to try: Seafood is the highlight—grilled fish, calamari, octopus, and fresh mussels are served daily. Olive oil and fresh vegetables are also key parts of the cuisine.

Food place idea: Restaurants along the Durrës promenade and beach area are the best for sunset seafood dinners.

Best time to visit: June to early September is best for beaches and swimming. If you prefer fewer tourists, May and September are perfect.

Historical fact: The Durrës Amphitheatre is one of the largest Roman amphitheaters in the Balkans and shows how important Durrës was in ancient times.`,

diber:`Dibër County

Dibër County is a mountainous region known for its wild nature, traditional villages, and untouched landscapes. It is one of the best places in Albania for hiking, nature tourism, and experiencing rural life. The region is less developed, which makes it very authentic and peaceful.

Traditional food to try: Jufka Dibre (handmade pasta), mountain cheese, honey, and roasted lamb are local specialties. Meals are usually homemade and very natural.

Food place idea: Guesthouses in mountain villages are the best place to try traditional cooking made by local families.

Best time to visit: Late spring (May–June) and early autumn (September) are best because the mountains are green and weather is comfortable for hiking.

Fun fact: Part of the region includes the impressive Korab Mountain, which is the highest peak in Albania.`,

shkoder:`Shkodër County

Shkodër County is one of Albania’s most cultural and historical regions. It is located near Lake Shkodër, the largest lake in the Balkans, and is surrounded by rivers and mountains. The city is known for its strong artistic traditions, photography culture, and music history.

Traditional food to try: Krap në tavë (baked carp from Lake Shkodër), as well as northern Albanian pies and meat dishes.

Food place idea: Lakeside restaurants and places near Rozafa Castle offer both traditional food and amazing views.

Best time to visit: Spring and early summer (April–June) are perfect for lake views and warm but not hot weather. Autumn is also beautiful with fewer tourists.

Historical fact: Rozafa Castle is linked to a famous legend about sacrifice and strength.`,

elbasan:`Elbasan County

Elbasan County lies in central Albania and has historically been an important trading and cultural crossroads. The city has an old Ottoman fortress where people still live and work today.

Traditional food to try: Ballokume is the most famous food here. It is a sweet cookie made for “Dita e Verës”.

Food place idea: Inside Elbasan Castle you can find traditional bakeries and restaurants.

Best time to visit: March 14 (festival day) is best, otherwise spring and autumn.

Fun fact: The city was originally a Roman settlement called Scampis.`,

fier:`Fier County

Fier County is known for agriculture and important ancient ruins.

Traditional food to try: Byrek, lamb dishes, dairy products, olive oil meals.

Food place idea: Rural farms and traditional restaurants.

Best time to visit: Spring.

Historical fact: Apollonia was once a major Greek colony.`,

korce:`Korçë County

Korçë County is a cultural and artistic center in southeastern Albania.

Traditional food to try: Lakror, roasted lamb, pickled vegetables, raki.

Food place idea: Old taverns with live music.

Best time to visit: Winter and summer festivals.

Fun fact: First Albanian school opened in 1887.`,

gjirokaster:`Gjirokastër County

Gjirokastër is famous for stone houses and Ottoman architecture.

Traditional food to try: Qifqi, oshaf, lamb dishes.

Food place idea: Old bazaar restaurants.

Best time to visit: Spring and autumn.

Historical fact: UNESCO World Heritage Site.`,

kukes:`Kukës County

Kukës is a remote mountainous region with lakes and rivers.

Traditional food to try: Flija, corn bread, dairy, roasted meat.

Food place idea: Mountain guesthouses.

Best time to visit: Summer.

Fun fact: Hosted refugees during Kosovo war.`,

lezhe:`Lezhë County

Lezhë is a coastal and historical region.

Traditional food to try: Tavë Lezheje, seafood.

Food place idea: Shëngjin beach restaurants.

Best time to visit: Summer.

Historical fact: Skanderbeg burial site.`,

berat:`Berat County

Berat is the “City of a Thousand Windows”.

Traditional food to try: Pula me përshesh, olive oil dishes.

Food place idea: River view restaurants.

Best time to visit: Spring and autumn.

Fun fact: UNESCO World Heritage Site.`,

vlore:`Vlorë County

Vlorë is where Albania declared independence in 1912.

Traditional food to try: Seafood, octopus, grilled fish.

Food place idea: Lungomare coastline.

Best time to visit: Summer.

Historical fact: Adriatic meets Ionian Sea.`
};

/* SEARCH */
function searchCity(){

let input = normalize(document.getElementById("cityInput").value);

let found = Object.keys(counties).find(c =>
normalize(c).includes(input)
);

if(!found){
document.getElementById("msg").innerText =
"This place is not an Albania’s county 🇦🇱";
document.getElementById("infoCard").style.display = "none";
return;
}

let coords = counties[found];

if(marker) map.removeLayer(marker);

marker = L.marker(coords).addTo(map)
.bindPopup(found.toUpperCase())
.openPopup();

map.setView(coords,10);

document.getElementById("infoCard").style.display = "block";
document.getElementById("title").innerText = found.toUpperCase();
document.getElementById("text").innerText = cityInfo[found];

document.getElementById("msg").innerText = "";

}
</script>

</body>
</html>
