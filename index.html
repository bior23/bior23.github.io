<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Climaplan Albania</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { font-family: Arial; text-align:center; margin:0; }
header { background:#2d6cdf; color:white; padding:15px; }
input, button { padding:10px; margin:5px; }
#map { height:450px; width:95%; margin:auto; border-radius:10px; }
</style>
</head>

<body>

<header>
<h2>Climaplan Albania 🇦🇱</h2>
</header>

<br>

<input id="cityInput" placeholder="Enter ANY Albanian place">
<button onclick="searchCity()">Search</button>

<p id="msg"></p>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 🗺️ MAP
let map = L.map('map').setView([41.3275,19.8189],8);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'OpenStreetMap'
}).addTo(map);

let marker;

// 🌍 SEARCH FUNCTION (ALL ALBANIA via OpenStreetMap)
function searchCity(){

let city = document.getElementById("cityInput").value.trim();

if(city === ""){
document.getElementById("msg").innerText = "Enter a place";
return;
}

// 🔎 OpenStreetMap API
fetch(https://nominatim.openstreetmap.org/search?format=json&q=${city},Albania)
.then(res => res.json())
.then(data => {

if(!data || data.length === 0){
document.getElementById("msg").innerText =
"This place is not in Albania 🇦🇱";
return;
}

let place = data[0];

let lat = place.lat;
let lon = place.lon;

// 🧹 remove old marker
if(marker) map.removeLayer(marker);

// 📍 add new marker
marker = L.marker([lat, lon]).addTo(map)
.bindPopup(place.display_name)
.openPopup();

// 🎯 move map
map.setView([lat, lon], 11);

document.getElementById("msg").innerText = "";

})
.catch(err=>{
document.getElementById("msg").innerText = "Error loading location";
});

}

</script>

</body>
</html>
