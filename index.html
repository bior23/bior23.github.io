<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climaplan</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#4facfe,#00f2fe);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:white;
width:100%;
max-width:700px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
text-align:center;
}

h1{
font-size:3rem;
color:#333;
margin-bottom:10px;
}

.subtitle{
color:#666;
margin-bottom:30px;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:25px;
}

input{
flex:1;
padding:12px;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 20px;
border:none;
background:#4facfe;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.9;
}

.weather-card{
background:#f7f9fc;
padding:20px;
border-radius:15px;
margin-top:20px;
display:none;
}

.temp{
font-size:3rem;
font-weight:bold;
color:#333;
}

.activity{
margin-top:20px;
padding:15px;
background:#e8f7ff;
border-radius:10px;
font-size:18px;
font-weight:bold;
}

.footer{
margin-top:25px;
font-size:14px;
color:#777;
}
</style>
</head>

<body>

<div class="container">

<h1>🌤️ Climaplan</h1>

<p class="subtitle">
Plan your activities based on the weather
</p>

<div class="search-box">
<input id="cityInput" placeholder="Enter a city">
<button onclick="generateWeather()">Search</button>
</div>

<div class="weather-card" id="weatherCard">
<h2 id="cityName"></h2>
<div class="temp" id="temperature"></div>
<p id="condition"></p>

<div class="activity" id="activity"></div>
</div>

<div class="footer">
Created for DNS & SSL Website Project
</div>

</div>

<script>

function generateWeather(){

const city =
document.getElementById("cityInput").value;

if(city===""){
alert("Please enter a city");
return;
}

const weatherTypes = [
"Sunny",
"Rainy",
"Cloudy",
"Cold"
];

const selected =
weatherTypes[Math.floor(Math.random()*weatherTypes.length)];

let temp;
let activity;

if(selected==="Sunny"){
temp="28°C";
activity="☀️ Perfect for hiking, cycling or a picnic!";
}

if(selected==="Rainy"){
temp="17°C";
activity="🌧️ Great day for movies, reading or a cozy café.";
}

if(selected==="Cloudy"){
temp="22°C";
activity="☁️ Nice weather for a walk around town.";
}

if(selected==="Cold"){
temp="8°C";
activity="❄️ Visit a museum or enjoy indoor activities.";
}

document.getElementById("weatherCard").style.display="block";

document.getElementById("cityName").innerText=city;

document.getElementById("temperature").innerText=temp;

document.getElementById("condition").innerText=selected;

document.getElementById("activity").innerText=activity;

}

</script>

</body>
</html>
